name: Mobile i18n Autofill (bot PR)

on:
  pull_request:
    branches: [development]
    paths:
      - 'cmp-android/**'
      - 'feature/**'
      - 'translate.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n-autofill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Match repo PR checks
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install google-genai
          fi

      - name: Run translation autofill (Gemma)
        working-directory: ./scripts/i18n
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python translate.py \
            --mode apply \
            --locales ar \
            --model gemma-3-27b-it \
            --batch-size 15 \
            --request-delay 2

      # Fast validation – matches existing CI expectations
      - name: Validate Android resources compile
        run: ./gradlew :cmp-android:processDebugResources

      - name: Create Pull Request with translations
        uses: peter-evans/create-pull-request@v7
        with:
          base: development
          branch: bot/mobile-i18n-autofill
          delete-branch: true
          add-paths: |
            cmp-android/**
            feature/**

          commit-message: "chore(i18n): autofill missing translations (ar)"
          title: "chore(i18n): autofill missing translations (ar)"
          body: |
            This PR was auto-generated by the i18n autofill workflow.

            - Adds missing locale folders/files
            - Fills missing string resources using AI translation
            - Preserves placeholders and formatting

            Please review translations before merging.
