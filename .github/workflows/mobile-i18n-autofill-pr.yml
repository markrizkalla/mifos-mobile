name: Mobile i18n Autofill (bot PR)

on:
  pull_request:
    branches: [development]
    paths:
      - 'cmp-android/**'
      - 'feature/**'
      - 'translate.py'


permissions:
  contents: write
  pull-requests: write

jobs:
  i18n-autofill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Match repo PR checks
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai lxml

      - name: Run translation autofill (Gemma)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python translate.py \
            --mode apply \
            --locales ar,en,es \
            --model gemma-3-27b-it \
            --batch-size 15 \
            --request-delay 2

      # Fast validation – matches existing CI expectations
      - name: Validate Android resources compile
        run: |
          ./gradlew \
            :cmp-android:processDemoDebugResources
          

      - name: Check for changes
        id: check_changes
        run: |
          # Check if there are any translation changes
          if git diff --quiet HEAD -- 'cmp-android/**' 'feature/**' 'core/**' 'cmp-shared/**' 'cmp-navigation/**' 'libs/**'; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No translation changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Translation changes detected"
            git diff --stat HEAD -- 'cmp-android/**' 'feature/**' 'core/**' 'cmp-shared/**' 'cmp-navigation/**' 'libs/**'
          fi

      - name: Create or update PR with translations
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="bot/mobile-i18n-autofill"
          BASE_BRANCH="development"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage translation changes
          git add cmp-android/ feature/ core/ cmp-shared/ cmp-navigation/ libs/ || true
          
          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi
          
          # Create commit
          git commit -m "chore(i18n): autofill missing translations"
          
          # Check if remote branch exists
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME exists, force pushing..."
            git push origin HEAD:"$BRANCH_NAME" --force
          else
            echo "Creating new branch $BRANCH_NAME..."
            git push origin HEAD:"$BRANCH_NAME"
          fi
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base "$BASE_BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR already exists, updated with new commits"
            gh pr comment "$EXISTING_PR" --body "🔄 Updated with latest translation changes from workflow run."
          else
            echo "Creating new PR..."
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "chore(i18n): autofill missing translations" \
              --body "This PR was auto-generated by the i18n autofill workflow.

          - Adds missing locale folders/files
          - Fills missing string resources using AI translation
          - Preserves placeholders and formatting

          Please review translations before merging."
          fi
