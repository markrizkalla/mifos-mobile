name: Mobile i18n Autofill (bot PR)

on:
  pull_request:
    branches: [development]
    paths:
      - 'cmp-android/**'
      - 'feature/**'
      - 'translate.py'


permissions:
  contents: write
  pull-requests: write

jobs:
  i18n-autofill:
    runs-on: ubuntu-latest

    steps:
      # Checkout the PR branch to get the new/modified strings
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Match repo PR checks
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install google-genai lxml
          fi

      - name: Run translation autofill (Gemma)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python translate.py \
            --mode apply \
            --locales ar,en \
            --model gemma-3-27b-it \
            --batch-size 15 \
            --request-delay 2


      - name: Create Pull Request with translations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create and switch to bot branch
          BRANCH_NAME="bot/mobile-i18n-autofill"
          git checkout -B "$BRANCH_NAME"

          # Commit changes
          git add 'cmp-android/**' 'feature/**' || true
          git commit -m "chore(i18n): autofill missing translations"

          # Force push to the bot branch
          git push origin "$BRANCH_NAME" --force

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base development --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ Updated existing PR #$EXISTING_PR"
          else
            # Create new PR
            gh pr create \
              --base development \
              --head "$BRANCH_NAME" \
              --title "chore(i18n): autofill missing translations" \
              --body "This PR was auto-generated by the i18n autofill workflow.

          - Adds missing locale folders/files
          - Fills missing string resources using AI translation
          - Preserves placeholders and formatting

          Please review translations before merging."
            echo "✅ Created new PR"
          fi
